<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>imbbloh · Listing Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d10;
    --surface: #16161c;
    --surface2: #1e1e26;
    --border: #2a2a36;
    --accent: #f0c140;
    --accent2: #e05c3a;
    --text: #eeeef2;
    --muted: #7a7a90;
    --green: #3ecf7e;
    --blue: #5b8dee;
    --radius: 14px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding-bottom: 48px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 540px;
    margin: 0 auto;
    padding: 28px 18px;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 38px;
    height: 38px;
    background: var(--accent);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .logo-text h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .logo-text p {
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 2px;
    font-family: 'DM Mono', monospace;
  }

  .notion-badge {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 0.68rem;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .notion-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
  }

  .notion-dot.connected {
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 16px;
  }

  .card-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .card-title::before {
    content: '';
    display: inline-block;
    width: 5px;
    height: 5px;
    background: var(--accent);
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Form */
  .form-group {
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.03em;
  }

  input, select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    padding: 11px 14px;
    transition: border-color 0.2s;
    outline: none;
    -webkit-appearance: none;
  }

  input:focus, select:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); opacity: 0.5; }
  select option { background: #1e1e26; }

  .price-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .price-input {
    position: relative;
  }

  .price-input span {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.82rem;
    pointer-events: none;
  }

  .price-input input { padding-left: 26px; }

  /* Platform pills */
  .platform-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .platform-pill {
    padding: 10px 12px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    line-height: 1.4;
    user-select: none;
  }

  .platform-pill.ns-pill {
    border-color: rgba(224, 0, 0, 0.3);
    color: #cc0000;
  }

  .platform-pill.ns-pill:hover, .platform-pill.ns-pill.selected-ns {
    background: rgba(224, 0, 0, 0.12);
    border-color: #e00000;
    color: #ff3333;
  }

  .platform-pill.ps-pill {
    border-color: rgba(0, 112, 209, 0.3);
    color: #0070d1;
  }

  .platform-pill.ps-pill:hover, .platform-pill.ps-pill.selected-ps {
    background: rgba(0, 112, 209, 0.12);
    border-color: #0070d1;
    color: #3399ff;
  }

  .platform-pill .pill-icon { font-size: 1.1rem; display: block; margin-bottom: 3px; }

  /* Generate button */
  .btn-generate {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    background: var(--accent);
    color: #0d0d10;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: none;
    cursor: pointer;
    transition: all 0.18s;
    margin-top: 6px;
  }

  .btn-generate:hover { background: #f5cc60; transform: translateY(-1px); }
  .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Output */
  .output-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 16px;
    display: none;
  }

  .output-card.visible { display: block; animation: slideUp 0.3s ease; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: none; }
  }

  .output-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }

  .output-label {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .output-text {
    padding: 16px 18px;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    line-height: 1.75;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 340px;
    overflow-y: auto;
  }

  .output-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 14px 18px;
    border-top: 1px solid var(--border);
  }

  .btn-action {
    padding: 11px;
    border-radius: 9px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn-copy {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .btn-copy:hover, .btn-copy.copied {
    border-color: var(--green);
    color: var(--green);
    background: rgba(62, 207, 126, 0.07);
  }

  .btn-notion {
    background: var(--green);
    color: #0d0d10;
  }

  .btn-notion:hover { background: #5adda0; }
  .btn-notion:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Tabs */
  .tab-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .tab-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .tab-title::before {
    content: '';
    display: inline-block;
    width: 5px;
    height: 5px;
    background: var(--green);
    border-radius: 50%;
    flex-shrink: 0;
  }

  .filter-pills {
    display: flex;
    gap: 6px;
  }

  .filter-pill {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.65rem;
    font-weight: 700;
    font-family: 'Syne', sans-serif;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    transition: all 0.15s;
  }

  .filter-pill.active {
    background: var(--accent);
    color: #0d0d10;
    border-color: var(--accent);
  }

  /* Listing cards */
  .listing-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
    animation: slideUp 0.25s ease;
  }

  .listing-item-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 10px;
  }

  .listing-item-name {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.92rem;
    line-height: 1.3;
    flex: 1;
  }

  .listing-item-prices {
    text-align: right;
    flex-shrink: 0;
  }

  .price-normal {
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 4px;
    justify-content: flex-end;
  }

  .price-premium {
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    color: var(--green);
    display: flex;
    align-items: center;
    gap: 4px;
    justify-content: flex-end;
    margin-top: 2px;
  }

  .listing-item-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .badge {
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.62rem;
    font-weight: 700;
    font-family: 'Syne', sans-serif;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }

  .badge-ns {
    background: rgba(240, 193, 64, 0.12);
    color: var(--accent);
    border: 1px solid rgba(240, 193, 64, 0.25);
  }

  .badge-ps {
    background: rgba(91, 141, 238, 0.12);
    color: var(--blue);
    border: 1px solid rgba(91, 141, 238, 0.25);
  }

  .listing-item-actions {
    display: flex;
    gap: 6px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .item-btn {
    flex: 1;
    padding: 7px;
    border-radius: 7px;
    font-size: 0.65rem;
    font-weight: 700;
    font-family: 'Syne', sans-serif;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    transition: all 0.15s;
    text-align: center;
  }

  .item-btn:hover { border-color: var(--accent); color: var(--accent); }
  .item-btn.del:hover { border-color: #ff4444; color: #ff4444; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }

  .empty-state .icon { font-size: 2.2rem; margin-bottom: 10px; }
  .empty-state p { font-size: 0.82rem; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--green);
    color: var(--green);
    padding: 10px 20px;
    border-radius: 30px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    z-index: 999;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .toast.error {
    border-color: var(--accent2);
    color: var(--accent2);
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 18px 0;
  }

  /* Notion sync indicator */
  .sync-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.72rem;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    padding: 0 18px 14px;
  }

  .sync-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo">
      <div class="logo-icon">🎮</div>
      <div class="logo-text">
        <h1>imbbloh</h1>
        <p>listing studio</p>
      </div>
    </div>
    <div class="notion-badge">
      <div class="notion-dot connected"></div>
      Sheets
    </div>
  </header>

  <!-- Form Card -->
  <div class="card">
    <div class="card-title">New Listing</div>

    <div class="form-group">
      <label>Game Title</label>
      <input type="text" id="gameName" placeholder="e.g. Mario Kart World" autocomplete="off" autocorrect="off">
    </div>

    <div class="form-group">
      <label>Platform</label>
      <div class="platform-grid">
        <div class="platform-pill ns-pill" id="pill-ns12" onclick="selectPlatform('ns12')" ontouchstart="selectPlatform('ns12')">
          <span class="pill-icon">🔴</span>NS1 & NS2
        </div>
        <div class="platform-pill ns-pill" id="pill-ns2" onclick="selectPlatform('ns2')" ontouchstart="selectPlatform('ns2')">
          <span class="pill-icon">🔴</span>NS2 Only
        </div>
        <div class="platform-pill ps-pill" id="pill-ps45" onclick="selectPlatform('ps45')" ontouchstart="selectPlatform('ps45')">
          <span class="pill-icon">🔵</span>PS4 & PS5
        </div>
        <div class="platform-pill ps-pill" id="pill-ps5" onclick="selectPlatform('ps5')" ontouchstart="selectPlatform('ps5')">
          <span class="pill-icon">🔵</span>PS5 Only
        </div>
      </div>
    </div>

    <div class="price-row">
      <div class="form-group">
        <label>🟡 Normal Price</label>
        <div class="price-input">
          <span>$</span>
          <input type="number" id="normalPrice" placeholder="0" min="0" step="0.50">
        </div>
      </div>
      <div class="form-group">
        <label>🟢 Premium Price</label>
        <div class="price-input">
          <span>$</span>
          <input type="number" id="premiumPrice" placeholder="0" min="0" step="0.50">
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>Official Store URL <span style="color:var(--green);font-size:0.65rem;font-weight:600">&#9679; Auto-generated</span></label>
      <input type="url" id="storeUrl" placeholder="https://store.nintendo.com/...">
    </div>

    <button class="btn-generate" id="generateBtn" onclick="generateListing()">
      ✦ Generate Listing
    </button>
  </div>

  <!-- Output Card -->
  <div class="output-card" id="outputCard">
    <div class="output-topbar">
      <div class="output-label">Generated Copy</div>
    </div>
    <div class="output-text" id="outputText"></div>
    <div class="sync-row" id="syncRow" style="display:none">
      <div class="sync-dot"></div>
      <span id="syncMsg">Saved to Notion</span>
    </div>
    <div class="output-actions">
      <button class="btn-action btn-copy" id="copyBtn" onclick="copyListing()">⎘ Copy</button>
      <button class="btn-action btn-notion" id="notionBtn" onclick="saveToSheets()">↑ Save to Sheets</button>
    </div>
  </div>

  <!-- Listings -->
  <div class="tab-header">
    <div class="tab-title">Saved Listings</div>
    <div class="filter-pills">
      <button class="filter-pill active" onclick="filterBy('all', this)">All</button>
      <button class="filter-pill" onclick="filterBy('ns', this)">NS</button>
      <button class="filter-pill" onclick="filterBy('ps', this)">PS</button>
    </div>
  </div>

  <div id="listingsContainer"></div>

</div>

<div class="toast" id="toast"></div>

<script>
  const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSe-0uL1GuyqAR0O5HbXIDoYFlVhGAkQa0zqTHcaYK4d_n7QwQ/formResponse';
  const FORM_FIELDS = {
    gameTitle: 'entry.2072004085',
    normalPrice: 'entry.710378137',
    premiumPrice: 'entry.1907115641',
    platform: 'entry.1583771425',
    gameUrl: 'entry.1870493243'
  };

  let selectedPlatform = null;
  let currentCopy = '';
  let currentFilter = 'all';
  let listings = JSON.parse(localStorage.getItem('imbbloh_listings') || '[]');

  // Platform selection
  function selectPlatform(p) {
    if (selectedPlatform === p) return;
    selectedPlatform = p;
    const isPS = (p === 'ps45' || p === 'ps5');

    // Reset all pills
    ['ns12','ns2','ps45','ps5'].forEach(id => {
      const el = document.getElementById('pill-' + id);
      if (!el) return;
      el.classList.remove('selected-ns', 'selected-ps');
      el.style.background = '';
      el.style.borderColor = '';
      el.style.color = '';
    });

    // Style selected pill with inline styles for Safari reliability
    const sel = document.getElementById('pill-' + p);
    if (sel) {
      if (isPS) {
        sel.style.background = 'rgba(0,112,209,0.15)';
        sel.style.borderColor = '#0070d1';
        sel.style.color = '#3399ff';
      } else {
        sel.style.background = 'rgba(224,0,0,0.15)';
        sel.style.borderColor = '#e00000';
        sel.style.color = '#ff3333';
      }
    }
    generateStoreUrl();
  }

  // Generate listing copy from template
  function generateListing() {
    const name = document.getElementById('gameName').value.trim();
    const normalPrice = document.getElementById('normalPrice').value;
    const premiumPrice = document.getElementById('premiumPrice').value;
    const storeUrl = document.getElementById('storeUrl').value.trim();

    if (!name) { showToast('Enter a game title', true); return; }
    if (!selectedPlatform) { showToast('Select a platform', true); return; }
    if (!normalPrice || !premiumPrice) { showToast('Enter both prices', true); return; }

    const isPS = selectedPlatform === 'ps45' || selectedPlatform === 'ps5';
    const trailerSuffix = isPS ? '+playstation+trailer' : '+switch+trailer';
    const encodedTitle = name.trim().replace(/\s+/g, '+') + trailerSuffix;
    const youtubeUrl = 'www.youtube.com/results?search_query=' + encodedTitle;

    let platformHeader = '';
    let boldPlatformLine = '';
    let storeSource = '';
    let normalVersionDetail = '';
    let officialLinkLabel = '';
    let tags = '';
    let listingTitleSuffix = '';

    if (selectedPlatform === 'ns12') {
      platformHeader = 'Nintendo Switch 1 & 2 / Nintendo Switch OLED';
      boldPlatformLine = '𝐅𝐨𝐫 𝐍𝐢𝐧𝐭𝐞𝐧𝐝𝐨 𝐒𝐰𝐢𝐭𝐜𝐡 𝟐 / 𝐒𝐰𝐢𝐭𝐜𝐡 𝐎𝐋𝐄𝐃 / 𝐒𝐰𝐢𝐭𝐜𝐡 𝟏';
      storeSource = 'Nintendo eShop';
      normalVersionDetail = 'Play on provided account (Offline only / Airplane Mode)';
      officialLinkLabel = '𝐎𝐟𝐟𝐢𝐜𝐢𝐚𝐥 𝐍𝐢𝐧𝐭𝐞𝐧𝐝𝐨 𝐈𝐧𝐟𝐨:';
      tags = `Tags: Nintendo Switch ${name}`;
      listingTitleSuffix = 'Nintendo Switch 2 / Nintendo Switch 1 / Switch OLED - Digital Game Download NS1 NS2 Game Nintendo Switch Digital Games | Instant Delivery | Instant Access | Safe & Affordable | Normal & Premium Versions Available';
    } else if (selectedPlatform === 'ns2') {
      platformHeader = 'Nintendo Switch 2 Only';
      boldPlatformLine = '𝐅𝐨𝐫 𝐍𝐢𝐧𝐭𝐞𝐧𝐝𝐨 𝐒𝐰𝐢𝐭𝐜𝐡 𝟐';
      storeSource = 'Nintendo eShop';
      normalVersionDetail = 'Play on provided account (Offline only / Airplane Mode)';

      storeSource = 'PlayStation Store';

  function copyListing() {
    if (!currentCopy) return;
    navigator.clipboard.writeText(currentCopy).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = '✓ Copied!';
      btn.classList.add('copied');
      showToast('Copied to clipboard!');
      setTimeout(() => {
        btn.textContent = '⎘ Copy';
        btn.classList.remove('copied');
      }, 2000);
    });
  }

  async function saveToSheets() {
    const name = document.getElementById('gameName').value.trim();
    const normalPrice = parseFloat(document.getElementById('normalPrice').value);
    const premiumPrice = parseFloat(document.getElementById('premiumPrice').value);
    const storeUrl = document.getElementById('storeUrl').value.trim();

    const platformLabels = {
      ns12: 'Switch 1&2',
      ns2: 'Switch 2',
      ps45: 'PS4 & PS5',
      ps5: 'PS5'
    };

    const btn = document.getElementById('notionBtn');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    try {
      const formData = new FormData();
      formData.append(FORM_FIELDS.gameTitle, name);
      formData.append(FORM_FIELDS.normalPrice, normalPrice);
      formData.append(FORM_FIELDS.premiumPrice, premiumPrice);
      formData.append(FORM_FIELDS.platform, platformLabels[selectedPlatform]);
      formData.append(FORM_FIELDS.gameUrl, storeUrl);

      await fetch(FORM_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: formData
      });

      // Save locally
      const listing = {
        id: Date.now(),
        name,
        platform: platformLabels[selectedPlatform],
        normalPrice,
        premiumPrice,
        storeUrl,
        copy: currentCopy,
        date: new Date().toLocaleDateString('en-SG', { day: 'numeric', month: 'short' })
      };

      listings.unshift(listing);
      localStorage.setItem('imbbloh_listings', JSON.stringify(listings));
      renderListings();

      document.getElementById('syncRow').style.display = 'flex';
      document.getElementById('syncMsg').textContent = 'Saved to Google Sheets · ' + listing.date;
      btn.textContent = '✓ Saved!';
      showToast('Saved to Google Sheets!');

      setTimeout(() => {
        document.getElementById('gameName').value = '';
        document.getElementById('normalPrice').value = '';
        document.getElementById('premiumPrice').value = '';
        document.getElementById('storeUrl').value = '';
        document.querySelectorAll('.platform-pill').forEach(el => {
          el.style.background = '';
          el.style.borderColor = '';
          el.style.color = '';
        });
        selectedPlatform = null;
        currentCopy = '';
        document.getElementById('outputCard').classList.remove('visible');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, 1800);

    } catch (err) {
      console.error(err);
      btn.disabled = false;
      btn.textContent = '↑ Save to Sheets';
      showToast('Error saving — try again', true);
    }
  }


  function filterBy(type, btn) {
    currentFilter = type;
    document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderListings();
  }

  function renderListings() {
    const container = document.getElementById('listingsContainer');
    let filtered = listings;

    if (currentFilter === 'ns') {
      filtered = listings.filter(l => l.platform.startsWith('Switch'));
    } else if (currentFilter === 'ps') {
      filtered = listings.filter(l => l.platform.startsWith('PS'));
    }

    if (filtered.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="icon">🎮</div><p>No listings yet.<br>Generate your first one above.</p></div>`;
      return;
    }

    container.innerHTML = filtered.map(l => {
      const isPS = l.platform.startsWith('PS');
      const badgeCls = isPS ? 'badge-ps' : 'badge-ns';
      return `
        <div class="listing-item">
          <div class="listing-item-top">
            <div class="listing-item-name">${l.name}</div>
            <div class="listing-item-prices">
              <div class="price-normal">🟡 $${l.normalPrice.toFixed(2)}</div>
              <div class="price-premium">🟢 $${l.premiumPrice.toFixed(2)}</div>
            </div>
          </div>
          <div class="listing-item-meta">
            <span class="badge ${badgeCls}">${l.platform}</span>
            <span style="font-size:0.65rem;color:var(--muted);font-family:'DM Mono',monospace;margin-left:auto">${l.date}</span>
          </div>
          <div class="listing-item-actions">
            <button class="item-btn" onclick="reCopy(${l.id})">⎘ Copy</button>
            <button class="item-btn del" onclick="deleteListing(${l.id})">Remove</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function reCopy(id) {
    const l = listings.find(x => x.id === id);
    if (l?.copy) {
      navigator.clipboard.writeText(l.copy).then(() => showToast('Listing copied!'));
    }
  }

  function deleteListing(id) {
    listings = listings.filter(x => x.id !== id);
    localStorage.setItem('imbbloh_listings', JSON.stringify(listings));
    renderListings();
    showToast('Removed');
  }

  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // Auto-generate store URL from game title
  function generateStoreUrl() {
    const name = document.getElementById('gameName').value.trim();
    if (!name || !selectedPlatform) return;

    const isPS = selectedPlatform === 'ps45' || selectedPlatform === 'ps5';

    // Normalize accented chars (é→e, ö→o etc)
    let s = name.normalize('NFD').replace(/[\u0300-\u036f]/g, '');

    // Strip ™ ® ©
    s = s.replace(/[\u2122\u00AE\u00A9]/g, '');

    // Em/en dash: PS → double hyphen, NS → single hyphen
    if (isPS) {
      s = s.replace(/\s*[\u2013\u2014]\s*/g, '--');
    } else {
      s = s.replace(/\s*[\u2013\u2014]\s*/g, '-');
    }

    // Colon: PS → double hyphen, NS → strip
    if (isPS) {
      s = s.replace(/\s*:\s*/g, '--');
    } else {
      s = s.replace(/:/g, '');
    }

    // Strip !
    s = s.replace(/!/g, '');

    // & → and, + → plus
    s = s.replace(/&/g, 'and').replace(/\+/g, 'plus');

    // Lowercase, spaces to hyphens
    s = s.toLowerCase().trim().replace(/\s+/g, '-');

    // Strip anything not a-z 0-9 or hyphen
    s = s.replace(/[^a-z0-9-]/g, '');

    // Collapse hyphens (preserve max double for PS)
    if (isPS) {
      s = s.replace(/-{3,}/g, '--');
    } else {
      s = s.replace(/-+/g, '-');
    }

    // Trim leading/trailing hyphens
    s = s.replace(/^-+|-+$/g, '');

    let url = '';
    if (selectedPlatform === 'ns12') {
      url = 'www.nintendo.com/us/store/products/' + s + '-switch/';
    } else if (selectedPlatform === 'ns2') {
      url = 'www.nintendo.com/us/store/products/' + s + '-switch-2/';
    } else {
      url = 'www.playstation.com/en-sg/games/' + s + '/';
    }

    document.getElementById('storeUrl').value = url;
    document.getElementById('storeUrl').style.color = 'var(--green)';
  }

  // Enter on game name triggers generate
  document.getElementById('gameName').addEventListener('keydown', e => {
    if (e.key === 'Enter') generateListing();
  });

  // Auto-generate URL when title is typed
  document.getElementById('gameName').addEventListener('input', () => {
    generateStoreUrl();
  });

  // Reset URL color when manually editing
  document.getElementById('storeUrl').addEventListener('input', () => {
    document.getElementById('storeUrl').style.color = 'var(--text)';
  });

  renderListings();
</script>
